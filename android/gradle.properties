# -Xmx8G + Metaspace 4G pedia ~12 GB para o daemon do Gradle. Numa máquina de
# 16 GB com o Windows/OneDrive/IDE abertos a JVM não consegue reservar isso e
# morre no arranque — o Gradle relata o sintoma como
# "java.io.IOException: Unable to establish loopback connection", que não tem
# nada a ver com rede. 3 GB de heap dão folga de sobra para este projeto.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Djava.net.preferIPv4Stack=true
android.useAndroidX=true
kotlin.incremental=false
kotlin.incremental.useClasspathSnapshot=false
# Compila o Kotlin dentro do daemon do Gradle em vez de subir um daemon
# separado — menos memória total em uso.
kotlin.compiler.execution.strategy=in-process
